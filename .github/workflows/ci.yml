name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: santa
          POSTGRES_PASSWORD: santa
          POSTGRES_DB: santa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santa -d santa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://santa:santa@localhost:5432/santa
      TEST_DATABASE_URL: postgresql://santa:santa@localhost:5432/santa_test
      APP_URL: http://localhost:3000
      APP_TIMEZONE: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral CI secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REMINDER_JOB_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Prepare isolated test database
        env:
          PGPASSWORD: santa
        run: |
          psql -h localhost -U santa -d santa -c 'CREATE DATABASE santa_test'
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
